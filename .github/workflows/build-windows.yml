name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Build production app
        run: npm run build
        shell: pwsh

      - name: Build Windows installer
        run: npm run electron:build
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Find installer artifacts
        id: artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem dist-electron\*.exe
          foreach ($f in $files) {
            echo "file=$($f.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "name=$($f.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-electron/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload artifacts for manual trigger
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-installer
          path: dist-electron/*.exe
          retention-days: 30